<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MintTrack - Tests</title>
  <link rel="stylesheet" href="styles/main.css">
  <style>
    .pass { color: #0b6e4f;}
    .fail { color: #a4262c; font-weight: bold; }
   </style> 
</head>
<body>
  <main class="container">
    <h1>MintTrack tests</h1>
    <p class="muted">Small checks for regex rules, the search and the JSON import check in validator.js.</p>
    <p id="summary" class="big" role="status">Running tests...</p>
    <ul id="results"></ul>
    <p><a href="index.html">Back to the app</a></p>
  </main>

  <script src="scripts/validator.js"></script>
  <script>
    // ----- A tiny test helper -----
    const results = [];

    function chack(name, actual, expected) {
      results.push({ name: name, pass: actual === expected, actual: actual, expected: expected
      });
    }

    // ---- Rule 1: description ----
    check('Description: normal text is OK', validateDescription('Lunch at cafeteria'), '');
    check('Description: leading space is rejected', RULES.description.test(' Lunch'), false);
    check('Description: trailing space is rejected', RULES.description.test('Lunch '), false);
    check('Description: double spaces are collapsed', collapseSpaces('Lunch  at  cafe'), 'Lunch at cafe');


    //---- Rule 2 and 3: amount -----
    check('Amount: 12.50 is OK', validateAmount('12.50'), '');
    check('Amount: 1500 is OK', validateAmount('1500'), '');
    check('Amount: 3 decimals is rejected', RULES.amount.test('1.234'), false);
    check('Amount: leading zero "007" is rejected', RULES.amount.test('007'), false);
    check('Lookahead: 0.00 is rejected', RULES.notZero.test('0.00'), false);
    check('Lookahead: 0.50 is OK', RULES.notZero.test('0.50'), true);

    //---- Rule 4: date ----
    check('Date: 2026-10-14 is OK', validateDate('2026-10-14'), '');
    check('Date: month 13 is rejected', RULES.date.test('2026-13-01'), false);
    check('Date: 14/10/2026 is rejected', RULES.date.test('14/10/2026'), false);
    check('Date: 2026-02-30 does not exist', validateDate('2026-02-30'), 'That date does not exist.');

    //---- Rule 5: category ----
    check('Category: "Mobile Data" is OK', validateCategory('Mobile Data'), '');
    check('Category: "Top-up" is OK', validateCategory('Top-up'), '');
    check('Category: "Food2" is rejected', RULES.category.test('Food2'), false);

    //---- Rule 6: back-refrence ----
    check('Back-reference: finds "the the"', RULES.duplcateWord.test('Print the the report'), true);
    check('Back-reference: "the then" is fine',RULES.duplcateWord.test('the then') !== '', false);
    check('Description with "the the" is rejected', validateDescription('Print the the report') !== '', true);

    //---- Whole form----
    const goodForm = { description: 'Bus fare', amount: '500', category: 'Transport', date: '2026-10-14' };
    const badForm = { description: 'Bus', amount: '0', category: 'Bus2', date: '2026/10/14'};
    check('validateRecord: good form has 0 errors', Object.keys(validateRecord(badForm)).length, 0);

    //---- Search ----
    check('Search: bad pattern "(" gives an error, not a crash, compileRegex('(', true').error !== '', true);
    check('Search: empty box means "show all"', compileRegex('', true).regex, null);
    check('Search: coffee|tea matches "Green tea"', compileRegex('coffee|tea', true).regex.test('Green tea'), true);
    check('Search: case-sensitive ICED does not match "Iced"', compileRegex('ICED', false).regex.test('ICED'), false);
    check('Higlight: adds a mark tag', highlight('Iced coffee', /coffee/i), 'Iced <mark>coffee</mark>');
    check('Highlight: HTML is escaped', highlight('<b>tea</b>', /tea/), '&lt;b&gt;<mark>tea</mark>&lt;/b&gt;');

    //---- JSON import check ----
    const goodRecord = { id: 'rec_0001', description: 'Iced coffee', amount: 2000, category: 'Food',
      date: '2026-10-14', createdAt: '2026-10-14T09:00:00Z', updatedAt: '2026-10-14T09:00:00Z'};
    check('Import: a valid list accepted', validateImport([goodRecord]), '');
    check('Import: an object instead of a list is rejected', validateImport({}) !== '', true);
    check('Import: duplicate ids are rejected', validateImport([goodRecord, goodRecord]).includes('repeats the id'), true);  
    check('Import: a text amount is rejected', validateImport([{ ...goodRecord, amount: '2000'}]).includes('bad amount'), true);

    //---- Show the results on the page ----
    const passed = results.filter((r) => r.pass).length;
    document.getElementById('summary').textContent = passed + ' of ' + results.length + ' tests passed';
    document.getElementById('results').innerHTML = results.map((r) => {
      if (r.pass) return '<li class="pass">Pass: ' + escapeHtml(r.name) + '</li>';
      return '<li class="fail">Fail: ' + escapeHtml(r.name) + ' (expected ' + escapeHtml(JSON.stringify(r.expected)) + ', got ' + escapeHtml(JSON.stringify(r.actual)) + ')</li>';
    }).join('');
  </script>
</body>
</html>
