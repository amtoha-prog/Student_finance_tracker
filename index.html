<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, intial-scale=1">
    <meta name="description" content="MintTrack helps students record spending and stay under budget.">
    <title>MintTrack - Student Finance Tracker</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
    <link rel="stylesheet" href="styles/main.css">
  </head>
  <body>
    <a class="skip-link" href="#main"> Skip to main content</a>

    <header class="site-header">
      <div class="container header-inner">
        <p class="logo"><span class="logo-dot" aria-hidden="true"></span>MintTrack</p>
        <nav aria-label="Main">
          <ul class="nav-list">
            <li><a href="#dashboard">Dashboard</a></li>
            <li><a href="#add">Add</a></li>
            <li><a href="#records">Records</a></li>
            <li><a href="#settings">Settings</a></li>
          <ul>
        </nav>
      </div>
    </header>

    <main id="main" class="container" tabindex="-1">
      <h1>Student finance tracker</h1>
      <p class="muted">Record what you spend, search it with regex and see how close you are to your budget.</p>

      <!--Dashboard-->
      <section id="dasboard" aria-labelledby="dashboard-title">
        <h2 id="dashboard-title">Dashboard</h2>
        <div class="card">
          <h3>Budget</h3>
          <p class="big" id="budget-text"></p>
          <div class="meter" aria-hidden="true">
            <div class="meter-fill" id="meter-fill">
          </div>

          <p id="cap-polite" class="cap-msg" aria-live="polite"></p>
          <p id="cap-assertive" class="cap-msg over" aria-live="assertive"></p>
        </div>

        <ul class="stats">
          <li class="card"><span class="muted">Transactions</span> <strong id="stat-count">0</strong></li>
          <li class="card"><span class="muted">Total spent</span> <strong id="stat-week">0</strong></li>
        </ul>

        <div class="card">
          <h3 id="chart-title">Spending in the last 7 days</h3>
          <ol class="chart" id="chart" aria-labelledby="chart-title"></ol>
        </div>
      </section>



  </body>

</html>
